# ===================================================================
# AI-CRM Backend Configuration (Spring Boot + MongoDB Atlas)
# ===================================================================
server.port=${PORT:8081}
spring.application.name=ai-crm-backend

# ===================================================================
# MONGODB ATLAS CONNECTION
# ===================================================================
# To connect your MongoDB Atlas database:
# 1. Go to cloud.mongodb.com -> Database -> Connect
# 2. Choose "Drivers" (Java) and copy your connection string
# 3. Replace the placeholder below or set the MONGODB_URI environment variable
#
# Format:
# spring.data.mongodb.uri=mongodb+srv://<USERNAME>:<PASSWORD>@<CLUSTER-URL>/ai_crm?retryWrites=true&w=majority
# ===================================================================
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ai_crm?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000}
spring.data.mongodb.database=ai_crm
spring.data.mongodb.auto-index-creation=false

# ===================================================================
# Logging configuration
# ===================================================================
logging.level.org.springframework.data.mongodb=INFO
logging.level.org.mongodb.driver=WARN
logging.level.com.aicrm=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
